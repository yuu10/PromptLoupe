# v で始まるタグ(例: v1.6.0)を push したら、配布用の zip を作って Releases に下書きで載せる
# 中身を確かめてから、GitHub の画面で「Publish release」を押して公開する
name: リリース

on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  release:
    # WPF は Windows でしかビルドできない
    runs-on: windows-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      # タグと PromptLoupe.csproj の <Version> が食い違っていたら止める
      - name: バージョンの確認
        id: version
        shell: pwsh
        run: |
          $tag = "${{ github.ref_name }}".TrimStart('v')
          $version = ([xml](Get-Content PromptLoupe.csproj)).Project.PropertyGroup.Version | Where-Object { $_ } | Select-Object -First 1
          if ($tag -ne $version) {
            Write-Error "タグ ($tag) と csproj の Version ($version) が一致しません"
            exit 1
          }
          "version=$version" >> $env:GITHUB_OUTPUT

      # .NET を入れていない PC でも動くように、自己完結型の単一 exe にする
      - name: 発行
        run: >
          dotnet publish PromptLoupe.csproj -c Release -r win-x64
          --self-contained true
          -p:PublishSingleFile=true
          -p:IncludeNativeLibrariesForSelfExtract=true
          -p:EnableCompressionInSingleFile=true
          -p:DebugType=none
          -o publish

      - name: zip にまとめる
        shell: pwsh
        run: |
          $zip = "PromptLoupe-${{ steps.version.outputs.version }}-win-x64.zip"
          Compress-Archive -Path publish/* -DestinationPath $zip
          "ZIP=$zip" >> $env:GITHUB_ENV

      - name: Releases に下書きを作る
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          $notes = @'
          ## ダウンロード

          `PromptLoupe-*-win-x64.zip` を展開して、`PromptLoupe.exe` を実行してください。.NET のインストールは不要です。

          ## 初めて起動するとき

          コード署名をしていないため、「Windows によって PC が保護されました」と表示されることがあります。「詳細情報」→「実行」で起動できます。

          ## 必要なもの

          - WebP の表示: Windows の「WebP 画像拡張機能」
          - HEIC の表示: 「HEIF 画像拡張機能」と「HEVC ビデオ拡張機能」

          ## Mac 版(試験版・動作未確認)

          Mac で動くかどうかを、まだ確かめていない試験版です。動いた・動かなかったなど、Issues で教えていただけると助かります。

          - Apple シリコン(M1 以降)の Mac: `PromptLoupe-Avalonia-*-osx-arm64.zip`
          - Intel の Mac: `PromptLoupe-Avalonia-*-osx-x64.zip`(HEIC・TIFF は表示できません)
          - macOS 12 以降。Apple シリコンでも、macOS 14 以前では HEIC・TIFF を表示できません

          zip を展開して、`PromptLoupe.app` をアプリケーションフォルダなどに移してください。Apple の公証を受けていないため、そのままでは「開けません」と表示されます。ターミナルで次を実行してから開いてください。

          ```
          xattr -cr /Applications/PromptLoupe.app
          ```

          ## 変更点

          (ここに書く)
          '@
          gh release create "${{ github.ref_name }}" $env:ZIP --draft --title "PromptLoupe ${{ steps.version.outputs.version }}" --notes $notes

  macos:
    # Mac 版(試験版・動作未確認)。Linux の上で Mac 向けに作り、上のジョブが作った下書きに加える。
    # Mac の実行環境は割り当てられないことがあるので使わない。署名はアドホック(Apple の証明書・公証はなし)
    needs: release
    strategy:
      matrix:
        rid: [osx-arm64, osx-x64]
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: rcodesign を入れる
        run: bash tools/install_rcodesign.sh

      - name: 発行
        run: >
          dotnet publish PromptLoupe.Avalonia/PromptLoupe.Avalonia.csproj -c Release -r ${{ matrix.rid }}
          --self-contained true
          -p:PublishSingleFile=true
          -p:EnableCompressionInSingleFile=true
          -p:DebugType=none
          -o publish

      # Avalonia 版の <Version> も、タグと合っていなければ止める
      - name: .app にまとめて、下書きに加える
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          tag="${{ github.ref_name }}"
          version=$(grep -oP '(?<=<Version>)[^<]+' PromptLoupe.Avalonia/PromptLoupe.Avalonia.csproj)
          if [ "${tag#v}" != "$version" ]; then
            echo "タグ ($tag) と PromptLoupe.Avalonia.csproj の Version ($version) が一致しません" >&2
            exit 1
          fi
          mkdir -p out
          bash tools/make_macos_app.sh publish out "$version"
          # verify は Mach-O にしか使えないので、本体を確かめ、.app の署名(CodeResources)があるかを見る
          rcodesign verify out/PromptLoupe.app/Contents/MacOS/PromptLoupe
          test -f out/PromptLoupe.app/Contents/_CodeSignature/CodeResources
          zip_name="PromptLoupe-Avalonia-$version-${{ matrix.rid }}.zip"
          (cd out && zip -qry "../$zip_name" PromptLoupe.app)
          gh release upload "$tag" "$zip_name"
