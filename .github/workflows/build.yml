# main と claude/ のブランチへのプッシュ、PR のたびに、ビルドとテストが通るかを確かめる
name: ビルド

on:
  push:
    branches: [main, 'claude/**']
  pull_request:

jobs:
  build:
    # WPF は Windows でしかビルドできない
    runs-on: windows-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: 復元
        run: dotnet restore

      - name: ビルド
        run: dotnet build -c Release --no-restore

  test:
    # 共通部分(PromptLoupe.Core)は OS に依存しないので、Linux でテストする
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: テスト
        run: dotnet test PromptLoupe.Tests -c Release

  avalonia:
    # Avalonia 版(開発中)。Windows・Linux でビルドが通るかを確かめる(画面の動作までは確かめない)。
    # Mac(macos-latest)は、実行環境が割り当てられないまま 15 分で取り消され、CI 全体が失敗になるので外した(2026-11-04)
    # 配布と同じ形(自己完結型・単一ファイル)で発行し、確認用に Actions の成果物(Artifacts)として置く。
    # Releases には出さない(確認していない OS には配布しない方針)
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            rid: win-x64
          - os: ubuntu-latest
            rid: linux-x64
    runs-on: ${{ matrix.os }}

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: ビルド
        run: dotnet build PromptLoupe.Avalonia -c Release

      - name: 発行(確認用)
        run: >
          dotnet publish PromptLoupe.Avalonia/PromptLoupe.Avalonia.csproj -c Release -r ${{ matrix.rid }}
          --self-contained true
          -p:PublishSingleFile=true
          -p:IncludeNativeLibrariesForSelfExtract=true
          -p:EnableCompressionInSingleFile=true
          -p:DebugType=none
          -o publish

      - name: 成果物として置く
        uses: actions/upload-artifact@v4
        with:
          name: PromptLoupe-Avalonia-${{ matrix.rid }}
          path: publish/
          retention-days: 14
