# main へのプッシュと PR のたびに、ビルドが通るかを確かめる
name: ビルド

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build:
    # WPF は Windows でしかビルドできない
    runs-on: windows-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x

      - name: 復元
        run: dotnet restore

      - name: ビルド
        run: dotnet build -c Release --no-restore
