# main と claude/ のブランチへのプッシュ、PR のたびに、ビルドとテストが通るかを確かめる
name: ビルド

on:
  push:
    branches: [main, 'claude/**']
  pull_request:

jobs:
  build:
    # WPF は Windows でしかビルドできない
    runs-on: windows-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x

      - name: 復元
        run: dotnet restore

      - name: ビルド
        run: dotnet build -c Release --no-restore

  test:
    # 共通部分(PromptLoupe.Core)は OS に依存しないので、Linux でテストする
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x

      - name: テスト
        run: dotnet test PromptLoupe.Tests -c Release
